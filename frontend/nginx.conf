# Redirect all HTTP to HTTPS
server {
    listen      80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Serves the Vite SPA and reverse-proxies /api/* and /health to the backend container.
server {
    listen      443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/178.128.203.208.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/178.128.203.208.nip.io/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Static asset caching (Vite emits hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend service on the docker network
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # CSV uploads can be large
        client_max_body_size 100M;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /docs    { proxy_pass http://backend:8000/docs; }
    location /redoc   { proxy_pass http://backend:8000/redoc; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    # SPA fallback — React Router handles unknown routes client-side
    location / {
        try_files $uri $uri/ /index.html;
    }
}
